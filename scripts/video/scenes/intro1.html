<!doctype html>
<html><head><meta charset="utf-8"><title>Intro: the café</title>
<link rel="stylesheet" href="base.css">
<style>
  .stage { position: absolute; inset: 0; display: grid; grid-template-columns: 980px 1fr; align-items: center; padding: 0 120px 0 90px; }
  .shop { position: relative; width: 900px; height: 820px; animation: up 1.1s var(--ease) both; }
  .shop svg { width: 100%; height: 100%; overflow: visible; }
  .glow { position: absolute; left: 120px; top: 360px; width: 660px; height: 360px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,180,90,.42), transparent); filter: blur(30px); animation: fade 1.6s .5s ease both; }
  .steam path { stroke: rgba(120,58,18,.55); stroke-width: 6; fill: none; stroke-linecap: round; stroke-dasharray: 60 200;
    animation: steam 2.6s linear infinite; }
  .steam path:nth-child(2) { animation-delay: -.9s; } .steam path:nth-child(3) { animation-delay: -1.7s; }
  @keyframes steam { from { stroke-dashoffset: 200; opacity: 0; } 30% { opacity: 1; } to { stroke-dashoffset: -60; opacity: 0; } }
  .bulb { animation: twinkle 2.4s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }
  .copy { display: flex; flex-direction: column; gap: 30px; }
  .copy .kicker { animation: up .8s .5s var(--ease) both; }
  .copy h1 { font-size: 88px; }
  .copy h1 span { display: block; animation: up 1s var(--ease) both; }
  .copy h1 span:nth-child(1) { animation-delay: .8s; } .copy h1 span:nth-child(2) { animation-delay: 1.05s; } .copy h1 span:nth-child(3) { animation-delay: 1.3s; color: var(--accent-text); }
  .copy .meta { display: flex; gap: 14px; animation: up .8s 2.2s var(--ease) both; }
  .two { display: inline-flex; gap: 10px; }
  .float { animation: drift 5s ease-in-out infinite alternate; }
  .fict { position: absolute; left: 90px; bottom: 44px; font-size: 18px; color: var(--faint); font-family: var(--mono); animation: fade 1s 2.5s both; }
</style></head>
<body><div class="grain"></div>
<div class="stage">
  <div class="shop"><div class="glow"></div>
    <svg viewBox="0 0 900 820">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2133"/><stop offset="1" stop-color="#121521"/></linearGradient>
        <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf8a"/><stop offset="1" stop-color="#ff9a4d"/></linearGradient>
        <pattern id="stripes" width="90" height="10" patternUnits="userSpaceOnUse"><rect width="45" height="10" fill="#ff9a4d"/><rect x="45" width="45" height="10" fill="#f4ede2"/></pattern>
      </defs>
      <!-- ground + building -->
      <rect x="20" y="770" width="860" height="6" rx="3" fill="rgba(255,255,255,.08)"/>
      <rect x="70" y="120" width="760" height="650" rx="10" fill="url(#wall)" stroke="rgba(255,255,255,.08)"/>
      <rect x="70" y="120" width="760" height="40" rx="10" fill="#232842"/>
      <!-- sign -->
      <g class="float"><rect x="190" y="190" width="520" height="92" rx="46" fill="#0b0d14" stroke="#8f7bff" stroke-width="3"/>
      <text x="450" y="249" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="750" font-size="40" fill="#eef0f7" letter-spacing="-1">South Congress Coffee</text></g>
      <!-- string lights -->
      <path d="M80 310 Q 265 350 450 310 T 820 310" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
      <g fill="#ffd27a">
        <circle class="bulb" cx="130" cy="322" r="7"/><circle class="bulb" cx="200" cy="333" r="7" style="animation-delay:-.6s"/><circle class="bulb" cx="270" cy="336" r="7" style="animation-delay:-1.2s"/>
        <circle class="bulb" cx="340" cy="330" r="7" style="animation-delay:-.3s"/><circle class="bulb" cx="410" cy="318" r="7" style="animation-delay:-1.8s"/><circle class="bulb" cx="490" cy="300" r="7" style="animation-delay:-.9s"/>
        <circle class="bulb" cx="560" cy="290" r="7" style="animation-delay:-1.5s"/><circle class="bulb" cx="630" cy="288" r="7" style="animation-delay:-.4s"/><circle class="bulb" cx="700" cy="296" r="7" style="animation-delay:-1.1s"/><circle class="bulb" cx="770" cy="306" r="7" style="animation-delay:-2s"/>
      </g>
      <!-- awning -->
      <path d="M100 370 H800 L830 450 H70 Z" fill="url(#stripes)"/>
      <path d="M70 450 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0 q 23.75 26 47.5 0" fill="#ff9a4d"/>
      <!-- window -->
      <rect x="120" y="500" width="440" height="230" rx="14" fill="url(#win)" opacity=".92"/>
      <rect x="120" y="500" width="440" height="230" rx="14" fill="none" stroke="#2a2f45" stroke-width="10"/>
      <line x1="340" y1="500" x2="340" y2="730" stroke="#2a2f45" stroke-width="8"/>
      <!-- cup in window -->
      <g transform="translate(205 590)"><path d="M0 20 h90 v40 a45 45 0 0 1 -90 0 z" fill="#f4ede2"/><path d="M90 32 a20 20 0 0 1 0 36" fill="none" stroke="#f4ede2" stroke-width="10"/>
        <g class="steam"><path d="M22 10 c-12 -18 12 -26 0 -46"/><path d="M45 6 c-12 -18 12 -26 0 -46"/><path d="M68 10 c-12 -18 12 -26 0 -46"/></g></g>
      <!-- menu board -->
      <g transform="translate(380 560)"><rect width="140" height="130" rx="10" fill="#1a1d2c"/><text x="70" y="40" text-anchor="middle" font-family="JetBrains Mono" font-size="17" fill="#ffd27a">NEW</text>
        <text x="70" y="72" text-anchor="middle" font-family="Instrument Sans" font-weight="700" font-size="19" fill="#eef0f7">Oat Milk</text><text x="70" y="96" text-anchor="middle" font-family="Instrument Sans" font-weight="700" font-size="19" fill="#eef0f7">Honey Latte</text>
        <text x="70" y="121" text-anchor="middle" font-family="JetBrains Mono" font-size="17" fill="#ffd27a">$6.50</text></g>
      <!-- door -->
      <rect x="610" y="500" width="160" height="270" rx="12" fill="#0e1019" stroke="#2a2f45" stroke-width="8"/>
      <rect x="630" y="520" width="120" height="120" rx="8" fill="url(#win)" opacity=".75"/>
      <circle cx="745" cy="660" r="7" fill="#ffd27a"/>
      <text x="690" y="700" text-anchor="middle" font-family="JetBrains Mono" font-size="18" fill="#4fe3c1">OPEN</text>
    </svg>
  </div>
  <div class="copy">
    <div class="kicker">Austin, TX · 78704</div>
    <h1 class="display"><span>Meet South</span><span>Congress Coffee.</span><span>One latte, two posts.</span></h1>
    <div class="meta"><span class="chip">a café in Austin</span><span class="chip a">version A</span><span class="chip b">version B</span></div>
  </div>
</div>
<div class="fict">Illustration · a fictional business</div>
</body></html>
