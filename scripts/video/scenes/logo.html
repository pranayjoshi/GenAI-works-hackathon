<!doctype html>
<html><head><meta charset="utf-8"><title>Ripple logo</title>
<link rel="stylesheet" href="base.css">
<style>
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding-bottom: 40px; }
  .mark { width: 300px; height: 300px; position: relative; }
  .mark svg { width: 100%; height: 100%; overflow: visible; }
  .ha, .hb { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 1.2s .2s cubic-bezier(.65,0,.35,1) forwards; }
  .hb { animation-delay: .35s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .ci { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw 1s .9s ease forwards; }
  .drop { transform-origin: 16px 16px; animation: pop .7s 1.3s var(--spring) both; }
  .split .ha { animation: draw 1.2s .2s cubic-bezier(.65,0,.35,1) forwards, sepA 1.2s 1.6s var(--ease) both; }
  .glow { position: absolute; inset: -60px; border-radius: 50%; background: radial-gradient(closest-side, rgba(143,123,255,.45), transparent); animation: fade 1.4s 1.1s both; }
  .rings { position: absolute; left: 50%; top: 50%; }
  .rings i { position: absolute; width: 1500px; height: 1500px; border-radius: 50%; border: 2px solid rgba(79,227,193,.35); animation: ring 3.6s 1.4s ease-out infinite both; }
  .rings i:nth-child(2) { animation-delay: 2.6s; border-color: rgba(91,140,255,.32); } .rings i:nth-child(3) { animation-delay: 3.8s; border-color: rgba(255,154,77,.3); }
  h1 { font-size: 168px; animation: up 1s 1.5s var(--ease) both; }
  .tag { font-size: 40px; color: var(--muted); letter-spacing: -0.01em; animation: up 1s 2.1s var(--ease) both; text-align: center; }
  .tag b { color: var(--text); font-weight: 600; }
  .bar { display: flex; gap: 14px; animation: up .9s 2.7s var(--ease) both; margin-top: 8px; }
</style></head>
<body><div class="grain"></div>
<div class="rings"><i></i><i></i><i></i></div>
<div class="center">
  <div class="mark"><div class="glow"></div>
    <svg viewBox="0 0 32 32">
      <path class="ha" pathLength="40" d="M16 3.5a12.5 12.5 0 0 0 0 25" fill="none" stroke="#5b8cff" stroke-width="3" stroke-linecap="round"/>
      <path class="hb" pathLength="40" d="M16 3.5a12.5 12.5 0 0 1 0 25" fill="none" stroke="#ff9a4d" stroke-width="3" stroke-linecap="round"/>
      <circle class="ci" pathLength="51" cx="16" cy="16" r="8" fill="none" stroke="#4fe3c1" stroke-width="1.8" opacity=".75"/>
      <path class="drop" d="M16 9.8c-1.2 2.2-4 5.2-4 7.6a4 4 0 0 0 8 0c0-2.4-2.8-5.4-4-7.6z" fill="#8f7bff"/>
    </svg>
  </div>
  <h1 class="display">Ripple</h1>
  <div class="tag">Simulates how <b>the public will react</b> to anything you post,<br>and shows you why.</div>
  <div class="bar"><span class="chip">ads</span><span class="chip">tweets</span><span class="chip">LinkedIn comments</span><span class="chip">announcements</span><span class="chip">statements</span></div>
</div>
</body></html>
