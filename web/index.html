<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Dry Run: test your post on a crowd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5efc'/%3E%3Cpath d='M9 22V10h6a6 6 0 0 1 0 12z' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 22V10h6a6 6 0 0 1 0 12z" fill="none" stroke="#fff" stroke-width="3"/></svg></span>
      <span class="brand-text"><b>Dry Run</b><small>Test your post on a crowd before you spend a dollar.</small></span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="setup">New test</a>
      <a href="#/runs" data-nav="runs">Runs</a>
      <a href="#/backtest" data-nav="backtest">Backtest</a>
    </nav>
    <div id="status-pill" class="status-pill" tabindex="0" role="button" aria-haspopup="dialog" title="Provider and data engine status"><span class="dot"></span><span class="status-text">Checking status...</span></div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <footer class="footer">
    <span>Simulated people sampled from Census and Pew data. Not real customers. Backtest numbers are shown as measured.</span>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="icon-btn modal-close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <aside id="drawer" class="drawer" hidden aria-label="Agent details">
    <button class="icon-btn drawer-close" aria-label="Close drawer">&times;</button>
    <div id="drawer-body"></div>
  </aside>
  <div id="toasts" class="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
